<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JKT48 LIVE EVENT</title>

<style>
/* =====================================================
   JKT48 LIVE EVENT MARKET
   BAGIAN 1/8 — HTML DASAR + LOGIN + CSS AWAL
   ===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#e91e63;
  --primary2:#ff4f91;
  --dark:#111827;
  --dark2:#1f2937;
  --bg:#f5f6fa;
  --white:#fff;
  --text:#1f2937;
  --muted:#6b7280;
  --danger:#ef4444;
  --success:#10b981;
  --warning:#f59e0b;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.hidden{
  display:none!important;
}

/* LOADING */
#loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.96);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:15px;
  z-index:9999;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #eee;
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* LOGIN */
.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top right,#ff8ab6 0,transparent 35%),
    linear-gradient(135deg,#111827,#24243e);
}

.login-box{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,.98);
  border-radius:24px;
  padding:30px;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
  animation:loginIn .5s ease;
}

@keyframes loginIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.96);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo-icon{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:25px;
  font-weight:bold;
  background:linear-gradient(135deg,var(--primary),#8b5cf6);
  box-shadow:0 10px 25px rgba(233,30,99,.3);
}

.logo h1{
  margin-top:12px;
  font-size:24px;
}

.logo p{
  margin-top:5px;
  color:var(--muted);
  font-size:13px;
}

.role-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:20px;
}

.role-btn{
  padding:11px 5px;
  border-radius:10px;
  background:#f1f2f6;
  color:#555;
  font-weight:bold;
  font-size:12px;
  transition:.2s;
}

.role-btn:hover{
  transform:translateY(-2px);
}

.role-btn.active{
  background:var(--primary);
  color:#fff;
  box-shadow:0 5px 15px rgba(233,30,99,.25);
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:11px;
  padding:12px 14px;
  outline:none;
  background:#fff;
  transition:.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(233,30,99,.1);
}

.btn{
  padding:12px 17px;
  border-radius:11px;
  font-weight:bold;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-primary{
  width:100%;
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 7px 18px rgba(233,30,99,.25);
}

.btn-secondary{
  background:#eee;
  color:#333;
}

.register-link{
  text-align:center;
  margin-top:18px;
  font-size:13px;
  color:var(--muted);
}

.register-link button{
  background:none;
  color:var(--primary);
  font-weight:bold;
}

/* APP */
#app{
  min-height:100vh;
  display:none;
}

/* SIDEBAR DASAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  background:var(--dark);
  color:#fff;
  padding:20px 14px;
  z-index:1000;
  transition:.3s;
}

.side-logo{
  padding:10px;
  margin-bottom:20px;
  font-weight:bold;
  font-size:18px;
}

.side-logo span{
  color:#ff4f91;
}

.side-menu{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.side-menu button{
  width:100%;
  padding:12px;
  text-align:left;
  color:#cbd5e1;
  background:transparent;
  border-radius:10px;
  transition:.2s;
}

.side-menu button:hover,
.side-menu button.active{
  color:#fff;
  background:rgba(255,255,255,.1);
}

.main{
  margin-left:250px;
  min-height:100vh;
  padding:25px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.menu-toggle{
  display:none;
  background:var(--dark);
  color:white;
  padding:10px 13px;
  border-radius:10px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:var(--shadow);
  animation:fadeIn .35s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}

/* MODAL */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:3000;
}

.modal{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:22px;
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{opacity:0;transform:scale(.9)}
  to{opacity:1;transform:scale(1)}
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close-btn{
  background:#eee;
  width:32px;
  height:32px;
  border-radius:50%;
}

/* TOAST */
#toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:5000;
  background:#222;
  color:#fff;
  padding:13px 18px;
  border-radius:10px;
  opacity:0;
  pointer-events:none;
  transform:translateY(15px);
  transition:.3s;
  max-width:320px;
}

#toast.show{
  opacity:1;
  transform:none;
}

/* RESPONSIVE */
@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    padding:18px;
  }

  .menu-toggle{
    display:block;
  }
}

@media(max-width:480px){
  .login-box{
    padding:22px;
    border-radius:18px;
  }

  .role-list{
    gap:5px;
  }

  .role-btn{
    font-size:10px;
    padding:10px 3px;
  }

  .main{
    padding:14px;
  }
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <b>JKT48 LIVE EVENT</b>
  <small>Memuat sistem...</small>
</div>

<!-- =====================================================
     HALAMAN LOGIN
     ===================================================== -->
<section id="loginPage" class="login-page hidden">

  <div class="login-box">

    <div class="logo">
      <div class="logo-icon">48</div>
      <h1>JKT48 LIVE EVENT</h1>
      <p>Marketplace Event Live JKT48 2026</p>
    </div>

    <!-- PILIH ROLE -->
    <div class="role-list">
      <button class="role-btn active" data-role="buyer"
              onclick="setRole('buyer',this)">
        PEMBELI
      </button>

      <button class="role-btn" data-role="admin"
              onclick="setRole('admin',this)">
        ADMIN
      </button>

      <button class="role-btn" data-role="owner"
              onclick="setRole('owner',this)">
        OWNER
      </button>
    </div>

    <!-- FORM LOGIN -->
    <form id="loginForm" onsubmit="login(event)">

      <div class="form-group">
        <label>Username</label>
        <input id="loginUsername"
               type="text"
               placeholder="Masukkan username"
               autocomplete="off"
               required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="loginPassword"
               type="password"
               placeholder="Masukkan password"
               autocomplete="off"
               required>
      </div>

      <button class="btn btn-primary" type="submit">
        LOGIN
      </button>

    </form>

    <div class="register-link" id="registerArea">
      Belum memiliki akun?
      <button onclick="openRegister()">Registrasi Pembeli</button>
    </div>

  </div>
</section>

<!-- =====================================================
     APLIKASI UTAMA
     ===================================================== -->
<div id="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="side-logo">
      JKT48 <span>LIVE EVENT</span>
    </div>

    <!-- MENU AKAN DIISI PADA BAGIAN BERIKUTNYA -->
    <nav class="side-menu" id="sideMenu">
    </nav>

  </aside>

  <!-- KONTEN -->
  <main class="main">

    <div class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">
        ☰
      </button>

      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <small id="pageSubtitle">JKT48 LIVE EVENT</small>
      </div>

      <div id="userBadge"></div>
    </div>

    <!-- AREA KONTEN -->
    <section id="content">
      <div class="card">
        <h3>Memuat dashboard...</h3>
      </div>
    </section>

  </main>
</div>

<!-- =====================================================
     MODAL REGISTRASI
     ===================================================== -->
<div class="modal-bg" id="registerModal">

  <div class="modal">

    <div class="modal-head">
      <h3>Registrasi Pembeli</h3>
      <button class="close-btn" onclick="closeRegister()">×</button>
    </div>

    <form id="registerForm" onsubmit="registerBuyer(event)">

      <div class="form-group">
        <label>Username</label>
        <input id="regUsername"
               type="text"
               placeholder="Username baru"
               autocomplete="off"
               required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="regPassword"
               type="password"
               placeholder="Password"
               required>
      </div>

      <div class="form-group">
        <label>Nama Lengkap</label>
        <input id="regName"
               type="text"
               placeholder="Nama lengkap"
               required>
      </div>

      <div class="form-group">
        <label>Nomor WhatsApp</label>
        <input id="regWhatsapp"
               type="tel"
               placeholder="08xxxxxxxxxx"
               required>
      </div>

      <button class="btn btn-primary" type="submit">
        DAFTAR
      </button>

    </form>

  </div>
</div>

<!-- MODAL UMUM -->
<div class="modal-bg" id="mainModal">
  <div class="modal" id="mainModalContent"></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
/* =====================================================
   BAGIAN 1/8 — JAVASCRIPT DASAR
   Bagian berikutnya akan melanjutkan variabel dan fungsi.
   ===================================================== */

/*
  CATATAN KEAMANAN:
  localStorage digunakan hanya untuk demo/prototipe.
  Jangan gunakan penyimpanan password seperti ini untuk
  sistem production.

  Untuk production gunakan:
  - Backend
  - Database
  - Authentication server
  - Hashing password
  - API
*/

/* DATA DASAR */
const OWNER = {
  username:"owner",
  password:"mich",
  name:"Owner"
};

let currentRole = "buyer";
let currentUser = null;

/* DATABASE LOCAL DEMO */
let db = {
  buyers: JSON.parse(localStorage.getItem("jkt_buyers") || "[]"),
  admins: JSON.parse(localStorage.getItem("jkt_admins") || "[]"),
  events: JSON.parse(localStorage.getItem("jkt_events") || "[]"),
  transactions: JSON.parse(localStorage.getItem("jkt_transactions") || "[]"),
  balanceHistory: JSON.parse(localStorage.getItem("jkt_balance_history") || "[]"),
  notifications: JSON.parse(localStorage.getItem("jkt_notifications") || "[]"),
  maintenance: localStorage.getItem("jkt_maintenance") === "true"
};

/* SIMPAN DATABASE */
function saveDB(){
  localStorage.setItem("jkt_buyers",JSON.stringify(db.buyers));
  localStorage.setItem("jkt_admins",JSON.stringify(db.admins));
  localStorage.setItem("jkt_events",JSON.stringify(db.events));
  localStorage.setItem("jkt_transactions",JSON.stringify(db.transactions));
  localStorage.setItem("jkt_balance_history",JSON.stringify(db.balanceHistory));
  localStorage.setItem("jkt_notifications",JSON.stringify(db.notifications));
  localStorage.setItem("jkt_maintenance",db.maintenance);
}

/* TOAST */
function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },2500);
}

/* ROLE */
function setRole(role,button){

  currentRole = role;

  document.querySelectorAll(".role-btn")
    .forEach(btn=>btn.classList.remove("active"));

  button.classList.add("active");

  const register = document.getElementById("registerArea");

  if(role === "buyer"){
    register.style.display = "block";
  }else{
    register.style.display = "none";
  }
}

/* MODAL REGISTRASI */
function openRegister(){
  document.getElementById("registerModal").style.display="flex";
}

function closeRegister(){
  document.getElementById("registerModal").style.display="none";
}

/* SIDEBAR */
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

/* MODAL UMUM */
function closeModal(){
  document.getElementById("mainModal").style.display="none";
}

/* LOGIN DASAR */
function login(e){
  e.preventDefault();

  const username =
    document.getElementById("loginUsername").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!username || !password){
    toast("Username dan password wajib diisi.");
    return;
  }

  document.getElementById("loading").style.display="flex";

  setTimeout(()=>{

    let user = null;

    /* OWNER */
    if(
      currentRole === "owner" &&
      username === OWNER.username &&
      password === OWNER.password
    ){
      user = {
        role:"owner",
        username:OWNER.username,
        name:OWNER.name
      };
    }

    /* ADMIN */
    if(currentRole === "admin"){
      user = db.admins.find(a=>
        a.username === username &&
        a.password === password &&
        a.status !== "nonaktif"
      );

      if(user){
        user = {...user,role:"admin"};
      }
    }

    /* PEMBELI */
    if(currentRole === "buyer"){
      user = db.buyers.find(b=>
        b.username === username &&
        b.password === password
      );

      if(user){
        user = {...user,role:"buyer"};
      }
    }

    document.getElementById("loading").style.display="none";

    if(!user){
      toast("Username atau password salah.");
      return;
    }

    /* MAINTENANCE */
    if(
      db.maintenance &&
      user.role !== "owner"
    ){
      toast("Website sedang dalam maintenance.");
      return;
    }

    currentUser = user;

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("app").style.display="block";

    /* Dashboard akan dibuat pada bagian berikutnya */
    if(typeof startApp === "function"){
      startApp();
    }

  },500);
}

/* REGISTRASI PEMBELI */
function registerBuyer(e){
  e.preventDefault();

  const username =
    document.getElementById("regUsername").value.trim();

  const password =
    document.getElementById("regPassword").value;

  const name =
    document.getElementById("regName").value.trim();

  const whatsapp =
    document.getElementById("regWhatsapp").value.trim();

  if(!username || !password || !name || !whatsapp){
    toast("Semua data wajib diisi.");
    return;
  }

  if(db.buyers.some(b=>b.username===username)){
    toast("Username sudah digunakan.");
    return;
  }

  /* BUAT ID PEMBELI 4 DIGIT UNIK */
  let id;

  do{
    id = String(
      Math.floor(1000 + Math.random()*9000)
    );
  }while(db.buyers.some(b=>b.id===id));

  const buyer = {
    id,
    username,
    password,
    name,
    whatsapp,
    balance:0,
    totalTransactions:0,
    status:"aktif",
    createdAt:new Date().toISOString()
  };

  db.buyers.push(buyer);
  saveDB();

  closeRegister();

  document.getElementById("registerForm").reset();

  /* SIMPAN ID UNTUK DITAMPILKAN */
  document.getElementById("mainModalContent").innerHTML = `
    <div class="modal-head">
      <h3>Registrasi Berhasil</h3>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div style="text-align:center;padding:15px">
      <p>ID Pembeli Anda:</p>

      <h1 style="font-size:38px;margin:12px 0;color:#e91e63">
        ${id}
      </h1>

      <p style="color:#666;margin-bottom:18px">
        Simpan ID ini karena digunakan sebagai identitas
        pengisian saldo.
      </p>

      <button class="btn btn-primary"
        onclick="copyBuyerId('${id}')">
        SALIN ID
      </button>
    </div>
  `;

  document.getElementById("mainModal").style.display="flex";
}

/* SALIN ID */
function copyBuyerId(id){

  if(navigator.clipboard){
    navigator.clipboard.writeText(id);
    toast("ID Pembeli berhasil disalin.");
  }else{
    toast("ID Pembeli: "+id);
  }
}

/* =====================================================
   TAMPILKAN LOGIN SETELAH HALAMAN SIAP
   ===================================================== */

window.addEventListener("load",()=>{

  setTimeout(()=>{
    document.getElementById("loading").style.display="none";
    document.getElementById("loginPage").classList.remove("hidden");
  },400);

});
</script>
<!-- =====================================================
     BAGIAN 2/8
     DASHBOARD + SIDEBAR + NAVIGASI + PROFIL PEMBELI
     ===================================================== -->

<script>

/* =====================================================
   NAVIGASI APLIKASI
   ===================================================== */

function startApp(){

  buildSidebar();

  document.getElementById("userBadge").innerHTML =
    `<span style="font-weight:bold">
      ${currentUser.name || currentUser.username}
    </span>`;

  showPage("dashboard");
}


/* =====================================================
   SIDEBAR SESUAI ROLE
   ===================================================== */

function buildSidebar(){

  const menu = document.getElementById("sideMenu");

  let html = "";

  if(currentUser.role === "owner"){

    html = `
      <button onclick="showPage('dashboard')">🏠 Dashboard</button>
      <button onclick="showPage('buyers')">👥 Kelola Pembeli</button>
      <button onclick="showPage('admins')">🛡️ Kelola Admin</button>
      <button onclick="showPage('events')">🎬 Event</button>
      <button onclick="showPage('transactions')">💳 Transaksi</button>
      <button onclick="showPage('history')">📜 Riwayat</button>
      <button onclick="showPage('notifications')">🔔 Notifikasi</button>
      <button onclick="showPage('maintenance')">⚙️ Maintenance</button>
      <button onclick="showPage('settings')">🔧 Pengaturan</button>
      <button onclick="logout()">🚪 Logout</button>
    `;

  }else if(currentUser.role === "admin"){

    html = `
      <button onclick="showPage('dashboard')">🏠 Dashboard</button>
      <button onclick="showPage('postEvent')">➕ Posting Event</button>
      <button onclick="showPage('myEvents')">🎬 Event Saya</button>
      <button onclick="showPage('events')">📋 Kelola Event</button>
      <button onclick="showPage('topup')">💰 Isi Saldo</button>
      <button onclick="showPage('history')">📜 Riwayat</button>
      <button onclick="logout()">🚪 Logout</button>
    `;

  }else{

    html = `
      <button onclick="showPage('dashboard')">🏠 Dashboard</button>
      <button onclick="showPage('events')">🎬 Event Live</button>
      <button onclick="showPage('upcoming')">🕐 Event Akan Tayang</button>
      <button onclick="showPage('balance')">💰 Saldo</button>
      <button onclick="showPage('history')">📜 Riwayat Pembelian</button>
      <button onclick="showPage('profile')">👤 Profil</button>
      <button onclick="logout()">🚪 Logout</button>
    `;
  }

  menu.innerHTML = html;
}


/* =====================================================
   TAMPILKAN HALAMAN
   ===================================================== */

function showPage(page){

  const content = document.getElementById("content");
  const title = document.getElementById("pageTitle");

  /* Tutup sidebar pada HP */
  document.getElementById("sidebar").classList.remove("open");

  let html = "";

  if(page === "dashboard"){

    title.textContent = "Dashboard";

    if(currentUser.role === "owner"){
      html = ownerDashboard();
    }else if(currentUser.role === "admin"){
      html = adminDashboard();
    }else{
      html = buyerDashboard();
    }

  }

  else if(page === "profile"){

    title.textContent = "Profil";
    html = profilePage();

  }

  else if(page === "balance"){

    title.textContent = "Saldo";
    html = balancePage();

  }

  else if(page === "events" || page === "upcoming"){

    title.textContent =
      page === "upcoming"
      ? "Event Akan Tayang"
      : "Event Live";

    html = eventPage(page);

  }

  else if(page === "history"){

    title.textContent = "Riwayat";
    html = historyPage();

  }

  else if(page === "buyers"){

    title.textContent = "Kelola Pembeli";
    html = buyersPage();

  }

  else if(page === "admins"){

    title.textContent = "Kelola Admin";
    html = adminsPage();

  }

  else if(page === "postEvent"){

    title.textContent = "Posting Event";
    html = postEventPage();

  }

  else if(page === "myEvents"){

    title.textContent = "Event Saya";
    html = myEventsPage();

  }

  else if(page === "topup"){

/* =====================================================

   ===================================================== */

function openTopup(id){

  const buyer=getBuyer(id);

  if(!buyer){
    toast("Data pembeli tidak ditemukan.");
    return;
  }

  document.getElementById("mainModalContent").innerHTML=`

    <div class="modal-head">
      <h3>ISI SALDO PEMBELI</h3>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div class="form-group">
      <label>ID Pembeli</label>
      <input value="${buyer.id}" disabled>
    </div>

    <div class="form-group">
      <label>Username</label>
      <input value="${buyer.username}" disabled>
    </div>

    <div class="form-group">
      <label>Saldo Saat Ini</label>
      <input value="${rupiah(buyer.balance)}" disabled>
    </div>

    <div class="form-group">
      <label>Jumlah Saldo</label>

      <input
        id="topupAmount"
        type="number"
        min="1"
        placeholder="Contoh: 100000"
        oninput="previewTopup()">

      <small style="color:#777">
        Masukkan nominal tanpa titik.
      </small>
    </div>

    <div id="topupPreview"
         style="
         background:#f8f8f8;
         border-radius:10px;
         padding:12px;
         margin-bottom:15px">
      Saldo setelah pengisian: -
    </div>

    <div style="
      display:flex;
      gap:10px">

      <button
        class="btn btn-primary"
        style="flex:1"
        onclick="confirmTopup('${buyer.id}')">
        KONFIRMASI
      </button>

      <button
        class="btn btn-secondary"
        onclick="closeModal()">
        BATAL
      </button>

    </div>
  `;

  document.getElementById("mainModal").style.display="flex";
}


/* =====================================================
   PREVIEW SALDO
   ===================================================== */

function previewTopup(){

  const buyer=getBuyer(
    document.querySelector("#topupAmount")
      ?.closest(".modal")
      ? ""
      : ""
  );

  const amount=Number(
    document.getElementById("topupAmount")?.value||0
  );

  const box=document.getElementById("topupPreview");

  if(!box)return;

  if(amount<=0){

    box.textContent="Saldo setelah pengisian: -";
    return;

  }

  /*
    Cari saldo dari data yang sedang dibuka.
    ID disimpan sementara pada elemen modal.
  */

  const title=document.querySelector(".modal h3");

  if(!window.selectedTopupId)return;

  const b=getBuyer(window.selectedTopupId);

  if(!b)return;

  box.innerHTML=
    "Saldo setelah pengisian: <b>"+
    rupiah(b.balance+amount)+
    "</b>";
}


/* =====================================================
   KONFIRMASI ISI SALDO
   ===================================================== */

function confirmTopup(id){

  const buyer=getBuyer(id);
  const input=document.getElementById("topupAmount");

  if(!buyer || !input)return;

  const amount=Number(input.value);

  if(!amount || amount<=0){
    toast("Nominal harus lebih dari Rp0.");
    return;
  }

  if(amount<0){
    toast("Nominal tidak boleh negatif.");
    return;
  }

  const before=Number(buyer.balance)||0;

  buyer.balance=before+amount;

  db.balanceHistory.push({
    id:"SAL-"+Date.now(),
    buyerId:buyer.id,
    username:buyer.username,
    amount,
    before,
    after:buyer.balance,
    by:currentUser.username,
    byRole:currentUser.role,
    date:new Date().toISOString()
  });

  saveDB();

  closeModal();

  toast(
    "Saldo "+buyer.username+
    " berhasil ditambahkan "+rupiah(amount)
  );

  if(currentUser.role==="owner"){
    showPage("buyers");
  }

}


/* =====================================================
   PERBAIKAN ID TOPUP TERPILIH
   ===================================================== */

const oldOpenTopup=openTopup;

openTopup=function(id){

  window.selectedTopupId=id;

  oldOpenTopup(id);

  setTimeout(()=>{
    const input=document.getElementById("topupAmount");

    if(input){
      input.addEventListener("input",previewTopup);
    }
  },50);

};

/* =====================================================
   VALIDASI DATA PEMBELI
   ===================================================== */

function validateBuyerData(){

  const usernames=new Set();

  for(const b of db.buyers){

    if(!b.username || !b.password || !b.name){
      return false;
    }

    if(usernames.has(b.username)){
      return false;
    }

    usernames.add(b.username);
  }

  return true;
}

/* =====================================================
   UPDATE DATA USER AKTIF
   ===================================================== */

function syncCurrentUser(){

  if(!currentUser)return;

  if(currentUser.role==="buyer"){

    const b=getBuyer(currentUser.id);

    if(b){
      currentUser={...b,role:"buyer"};
    }

  }

  if(currentUser.role==="admin"){

    const a=db.admins.find(
      x=>x.username===currentUser.username
    );

    if(a){
      currentUser={...a,role:"admin"};
    }

  }

}


/* =====================================================
   PATCH showPage UNTUK HALAMAN TAMBAHAN
   ===================================================== */

const originalShowPage=showPage;

showPage=function(page){

  if(page==="balanceHistory"){
    document.getElementById("pageTitle").textContent="Riwayat Saldo";

      balanceHistoryPage();
    return;

  originalShowPage(page);

/* =====================================================

   ===================================================== */

document.addEventListener("input",function(e){

  if(e.target.id==="topupAmount"){

function isMaintenance(){

  if(db.maintenance){

}

/* =====================================================

   ===================================================== */

function createAdmin(e){

  e.preventDefault();

  if(currentUser.role!=="owner"){
    toast("Akses ditolak.");
    return;
  }

  const name=
    document.getElementById("adminName").value.trim();

  const username=
    document.getElementById("adminUsername").value.trim();

  const password=
    document.getElementById("adminPassword").value;

  const status=
    document.getElementById("adminStatus").value;

  const canTopup=
    document.getElementById("adminCanTopup").checked;

  if(!name || !username || !password){

    toast("Semua data Admin wajib diisi.");
    return;

  }

  /* Username Admin tidak boleh sama */
  if(db.admins.some(a=>a.username===username)){

    toast("Username Admin sudah digunakan.");
    return;

  }

  /* Username Owner tidak boleh dipakai */
  if(username===OWNER.username){

    toast("Username tersebut tidak dapat digunakan.");
    return;

  }

  const admin={

    id:adminId(),

    name:name,

    username:username,

    password:password,

    status:status,

    canTopup:canTopup,

    createdAt:new Date().toISOString()

  };

  db.admins.push(admin);

  saveDB();

  closeModal();

  toast("Admin berhasil dibuat.");

  showPage("admins");
}

/* =====================================================

function saveAdminEdit(e,id){

  e.preventDefault();

  const admin=db.admins.find(a=>a.id===id);

  if(!admin){
    toast("Admin tidak ditemukan.");
    return;
  }

  const name=
    document.getElementById("editAdminName").value.trim();

  const status=
    document.getElementById("editAdminStatus").value;

  const canTopup=
    document.getElementById("editAdminTopup").checked;

  if(!name){

    toast("Nama Admin tidak boleh kosong.");
    return;

  }

  admin.name=name;
  admin.status=status;
  admin.canTopup=canTopup;

  saveDB();

  closeModal();

  toast("Data Admin berhasil diperbarui.");

  showPage("admins");
}


/* =====================================================
   AKTIF / NONAKTIF ADMIN
   ===================================================== */

function toggleAdmin(id){

  const admin=db.admins.find(a=>a.id===id);

  if(!admin)return;

  admin.status=
    admin.status==="aktif"
    ?"nonaktif"
    :"aktif";

  saveDB();

  toast(
    admin.status==="aktif"
    ?"Admin berhasil diaktifkan."
    :"Admin berhasil dinonaktifkan."
  );

  showPage("admins");
}


/* =====================================================
   HAPUS ADMIN
   ===================================================== */

function deleteAdmin(id){

  const admin=db.admins.find(a=>a.id===id);

  if(!admin)return;

  const yakin=confirm(
    "Hapus Admin "+admin.name+"?"
  );

  if(!yakin)return;

  db.admins=db.admins.filter(a=>a.id!==id);

  saveDB();

  toast("Admin berhasil dihapus.");

  showPage("admins");
}

function formatDate(date){

      month:"2-digit",
      year:"numeric"

}

  const admin=db.admins.find(
    a=>a.id===currentUser.id
  );

  return !!(admin && admin.status==="aktif" && admin.canTopup);

function syncAdminUser(){

  if(
    !currentUser ||
    currentUser.role!=="admin"
  ){
    return;
  }

  const admin=db.admins.find(
    a=>a.username===currentUser.username
  );

  if(admin){

    currentUser={
      ...admin,
      role:"admin"
    };

  }

}

/* =====================================================
   BUAT EVENT
   ===================================================== */

function createEvent(e){

  e.preventDefault();

  if(
    currentUser.role!=="owner" &&
    currentUser.role!=="admin"
  ){
    toast("Akses ditolak.");
    return;
  }

  if(
    currentUser.role==="admin" &&
    db.maintenance
  ){
    toast("Website sedang maintenance.");
    return;
  }


  const name=
    document.getElementById("eventName").value.trim();

  const member=
    document.getElementById("eventMember").value.trim();

  const description=
    document.getElementById("eventDescription").value.trim();

  const price=
    Number(document.getElementById("eventPrice").value);

  const date=
    document.getElementById("eventDate").value;

  const start=
    document.getElementById("eventStart").value;

  const end=
    document.getElementById("eventEnd").value;

  const image=
    document.getElementById("eventImage").value.trim();

  const link=
    document.getElementById("eventLink").value.trim();

  const platform=
    document.getElementById("eventPlatform").value;


  /* VALIDASI */

  if(
    !name ||
    !member ||
    !description ||
    !date ||
    !start ||
    !end
  ){
    toast("Semua data utama event wajib diisi.");
    return;
  }

  if(!price || price<=0){
    toast("Harga harus lebih dari Rp0.");
    return;
  }

  if(!validURL(image) && image){
    toast("URL foto tidak valid.");
    return;
  }

  if(!validURL(link) && link){
    toast("Link live tidak valid.");
    return;
  }


  const startTime=
    new Date(`${date}T${start}`).getTime();

  const endTime=
    new Date(`${date}T${end}`).getTime();


  if(endTime<=startTime){

    toast("Jam selesai harus setelah jam mulai.");
    return;

  }


  const event={

    id:"EVT-"+Date.now(),

    name:name,

    member:member,

    description:description,

    price:price,

    date:date,

    start:start,

    end:end,

    image:image,

    link:link,

    platform:platform,

    adminUsername:currentUser.username,

    adminName:currentUser.name,

    createdAt:new Date().toISOString(),

    status:"upcoming"

  };


  db.events.push(event);

  saveDB();

  toast("Event berhasil diposting.");

  showPage(
    currentUser.role==="admin"
    ?"myEvents"
    :"events"
  );
}

function saveEventEdit(formEvent,id){

  formEvent.preventDefault();

  const e=db.events.find(x=>x.id===id);

  if(!e){
    toast("Event tidak ditemukan.");
    return;
  }

  if(
    currentUser.role==="admin" &&
    db.maintenance
  ){

    toast("Website sedang maintenance.");
    return;

  }


  const name=
    document.getElementById("eventName").value.trim();

  const member=
    document.getElementById("eventMember").value.trim();

  const description=
    document.getElementById("eventDescription").value.trim();

  const price=
    Number(document.getElementById("eventPrice").value);

  const date=
    document.getElementById("eventDate").value;

  const start=
    document.getElementById("eventStart").value;

  const end=
    document.getElementById("eventEnd").value;

  const image=
    document.getElementById("eventImage").value.trim();

  const link=
    document.getElementById("eventLink").value.trim();

  const platform=
    document.getElementById("eventPlatform").value;


  if(
    !name ||
    !member ||
    !description ||
    !date ||
    !start ||
    !end
  ){

    toast("Data event belum lengkap.");
    return;

  }


  if(price<=0){

    toast("Harga harus lebih dari Rp0.");
    return;

  }


  if(image && !validURL(image)){

    toast("URL foto tidak valid.");
    return;

  }


  if(link && !validURL(link)){

    toast("Link live tidak valid.");
    return;

  }


  const startTime=
    new Date(`${date}T${start}`).getTime();

  const endTime=
    new Date(`${date}T${end}`).getTime();


  if(endTime<=startTime){

    toast("Jam selesai harus setelah jam mulai.");
    return;

  }


  e.name=name;
  e.member=member;
  e.description=description;
  e.price=price;
  e.date=date;
  e.start=start;
  e.end=end;
  e.image=image;
  e.link=link;
  e.platform=platform;

  saveDB();

  toast("Event berhasil diperbarui.");

  showPage(
    currentUser.role==="admin"
    ?"myEvents"
    :"events"
  );
}

function deleteEvent(id){

  const e=db.events.find(x=>x.id===id);

  if(!e)return;

  if(
    currentUser.role==="admin" &&
    e.adminUsername!==currentUser.username
  ){

    toast("Anda hanya dapat menghapus event sendiri.");
    return;

  }


  if(
    currentUser.role==="admin" &&
    db.maintenance
  ){

    toast("Website sedang maintenance.");
    return;

  }


  if(!confirm(
    "Hapus event \""+e.name+"\"?"
  ))return;


  db.events=db.events.filter(
    x=>x.id!==id
  );

  saveDB();

  closeModal();

  toast("Event berhasil dihapus.");

  showPage(
    currentUser.role==="admin"
    ?"myEvents"
    :"events"
  );
}


/* =====================================================
   STATUS EVENT
   UPCOMING / LIVE / ENDED
   ===================================================== */

function getEventStatus(e){

  if(!e.date || !e.start || !e.end){
    return "upcoming";
  }

  const now=Date.now();

  const start=
    new Date(
      `${e.date}T${e.start}`
    ).getTime();

  const end=
    new Date(
      `${e.date}T${e.end}`
    ).getTime();


  if(now<start){
    return "upcoming";
  }

  if(now>=start && now<end){
    return "live";
  }

  return "ended";
}

/* =====================================================
   KONFIRMASI PEMBELIAN
   ===================================================== */

function confirmPurchase(eventId){

  if(!currentUser){

    closeModal();

    toast(
      "Silakan daftar atau login terlebih dahulu."
    );

    return;

  }


  if(currentUser.role!=="buyer"){

    toast("Hanya pembeli yang dapat membeli.");
    return;

  }


  if(isMaintenance()){

    toast("Website sedang maintenance.");
    return;

  }


  const buyer=getCurrentBuyer();

  const event=db.events.find(
    e=>e.id===eventId
  );


  if(!buyer || !event){

    toast("Data pembelian tidak ditemukan.");
    return;

  }


  /* CEK STATUS TERBARU */

  const status=getEventStatus(event);

  if(status!=="upcoming"){

    closeModal();

    toast(
      status==="live"
      ?"Event sedang berlangsung. Pembelian sudah ditutup."
      :"Event sudah selesai."
    );

    return;

  }


  const price=Number(event.price);
  const before=Number(buyer.balance);


  if(price<=0){

    toast("Harga event tidak valid.");
    return;

  }


  if(before<price){

    toast("Saldo Anda tidak mencukupi.");
    return;

  }


  const after=before-price;

  const now=new Date();


  /* NOMOR TRANSAKSI */

  const transactionId=createTransactionId();


  /* TRANSAKSI */

  const transaction={

    id:transactionId,

    buyerId:buyer.id,

    buyerUsername:buyer.username,

    buyerName:buyer.name,

    eventId:event.id,

    eventName:event.name,

    member:event.member,

    price:price,

    adminUsername:event.adminUsername||"-",

    adminName:event.adminName||"-",

    balanceBefore:before,

    balanceAfter:after,

    date:now.toISOString(),

    status:"BERHASIL",

    eventLink:event.link||""

  };


  /* POTONG SALDO */

  buyer.balance=after;

  buyer.totalTransactions=
    Number(buyer.totalTransactions||0)+1;


  db.transactions.push(transaction);


  /* RIWAYAT SALDO */

  db.balanceHistory.push({

    id:"BAL-"+Date.now(),

    buyerId:buyer.id,

    username:buyer.username,

    amount:-price,

    before:before,

    after:after,

    by:"Pembelian "+event.name,

    byRole:"system",

    date:now.toISOString()

  });


  /* NOTIFIKASI OWNER */

  db.notifications.unshift({

    id:"NTF-"+Date.now(),

    type:"purchase",

    title:"Pembelian Baru",

    message:
      `Pembeli ${buyer.name} membeli event `+
      `${event.name} dengan harga ${rupiah(price)}.`,

    buyerId:buyer.id,

    buyerName:buyer.name,

    eventId:event.id,

    eventName:event.name,

    price:price,

    date:now.toISOString(),

    read:false

  });


  saveDB();

  syncCurrentUser();

  closeModal();

  toast("Pembelian berhasil.");


  /* TAMPILKAN STRUK */

  setTimeout(()=>{

    showReceipt(transaction);

  },300);

}


/* =====================================================
   ID TRANSAKSI
   ===================================================== */

function createTransactionId(){

  let id="TRX-"+Date.now();

  while(
    db.transactions.some(
      x=>x.id===id
    )
  ){

    id="TRX-"+Date.now()+"-"+Math.floor(
      Math.random()*100
    );

  }

  return id;
}

      String(t.id).toLowerCase().includes(q) ||
      String(t.buyerName).toLowerCase().includes(q) ||
      String(t.buyerUsername).toLowerCase().includes(q) ||
      String(t.eventName).toLowerCase().includes(q)

showPage=function(page){

  if(page==="info"){

    document.getElementById(
      "pageTitle"
    ).textContent="Tentang JKT48";

    document.getElementById(
      "content"
    ).innerHTML=
      jkt48InfoPage();

    return;

  }


  if(
    page==="settings" &&
    currentUser &&
    currentUser.role==="owner"
  ){

    document.getElementById(
      "pageTitle"
    ).textContent="Pengaturan";

    document.getElementById(
      "content"
    ).innerHTML=
      ownerSettingsPage();

    return;

  }


  oldShowPage8(page);

};

/* =====================================================
   UPDATE TITLE
   ===================================================== */

function updatePageTitle(text){

  const el=
    document.getElementById(
      "pageTitle"
    );

  if(el){
    el.textContent=text;
  }

}


/* =====================================================
   FIX ROLE CURRENT USER
   ===================================================== */

function normalizeCurrentUser(){

  if(!currentUser)return;


  if(!currentUser.role){

    if(currentUser.username==="owner"){
      currentUser.role="owner";
    }

  }

}


/* =====================================================
   CEK AKUN PEMBELI
   ===================================================== */

function validateBuyerLoginStatus(){

  if(
    !currentUser ||
    currentUser.role!=="buyer"
  ){
    return;
  }


  const buyer=
    getCurrentBuyer();


  if(
    buyer &&
    buyer.status==="nonaktif"
  ){

    toast("Akun pembeli dinonaktifkan.");

    logout();

  }

}


/* =====================================================
   PATCH LOGOUT FINAL
   ===================================================== */

const finalLogout8=logout;

logout=function(){

  currentUser=null;

  /* Tidak menyimpan sesi login */

  try{
    sessionStorage.clear();
  }catch(e){}


  try{
    localStorage.removeItem(
      "jkt_current_user"
    );
  }catch(e){}


  const app=
    document.getElementById("app");

  const loginPage=
    document.getElementById("loginPage");


  if(app){
    app.style.display="none";
  }

  if(loginPage){
    loginPage.style.display="flex";
  }


  const form=
    document.getElementById("loginForm");

  if(form){
    form.reset();
  }


  setRole("buyer");

  updatePageTitle("Dashboard");

};


/* =====================================================
   EVENT STATUS FINAL
   ===================================================== */

function getEventStatusText(e){

  const s=getEventStatus(e);

  if(s==="upcoming"){
    return "UPCOMING";
  }

  if(s==="live"){
    return "LIVE";
  }

  return "ENDED";

}


/* =====================================================
   CEK DATABASE
   ===================================================== */

function repairDB(){

  if(!Array.isArray(db.buyers))
    db.buyers=[];

  if(!Array.isArray(db.admins))
    db.admins=[];

  if(!Array.isArray(db.events))
    db.events=[];

  if(!Array.isArray(db.transactions))
    db.transactions=[];

  if(!Array.isArray(db.balanceHistory))
    db.balanceHistory=[];

  if(!Array.isArray(db.notifications))
    db.notifications=[];

  if(typeof db.maintenance!=="boolean")
    db.maintenance=false;


  db.buyers.forEach(b=>{

    if(typeof b.balance!=="number")
      b.balance=Number(b.balance)||0;

    if(typeof b.totalTransactions!=="number")
      b.totalTransactions=
        Number(b.totalTransactions)||0;

  });


  saveDB();

}


/* =====================================================
   JALANKAN PERBAIKAN DATABASE
   ===================================================== */

repairDB();


/* =====================================================
   CEK STATUS AKUN SETIAP BEBERAPA DETIK
   ===================================================== */

setInterval(function(){

  normalizeCurrentUser();

  validateBuyerLoginStatus();

  refreshEventStatus();

  updateNotificationBadge();

},3000);


/* =====================================================
   TUTUP SIDEBAR MOBILE
   ===================================================== */

document.addEventListener(
  "click",
  function(e){

    if(window.innerWidth>800)return;

    const sidebar=
      document.getElementById("sidebar");

    if(!sidebar)return;


    const clickedMenu=
      e.target.closest(
        ".side-item"
      );


    if(clickedMenu){
      sidebar.classList.remove("open");
    }

  }
);


/* =====================================================
   PREVENT NEGATIVE NUMBER
   ===================================================== */

document.addEventListener(
  "input",
  function(e){

    if(
      e.target.type==="number" &&
      Number(e.target.value)<0
    ){

      e.target.value=0;

    }

  }
);


/* =====================================================
   FINAL INITIALIZATION
   ===================================================== */

window.addEventListener(
  "load",
  function(){

    repairDB();

    refreshEventStatus();

    updateNotificationBadge();

  }
);
