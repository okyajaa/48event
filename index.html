<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meteor Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#10131a;color:#fff}
button,input,textarea{padding:10px;border:0;border-radius:8px;margin:4px}
button{background:#6c5ce7;color:white;cursor:pointer}input,textarea{width:95%;background:#222735;color:#fff}
#login{max-width:400px;margin:60px auto;padding:25px;background:#191e29;border-radius:15px;text-align:center}
#app{display:none}.side{position:fixed;width:210px;height:100%;background:#171b25;padding:15px}
.side button{display:block;width:100%;text-align:left}.main{margin-left:220px;padding:20px}
.card{background:#191e29;padding:15px;margin:10px 0;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
img{max-width:100%;border-radius:10px}@media(max-width:600px){.side{position:relative;width:100%;height:auto}.main{margin:0}}
</style>
</head>
<body>

<div id="login">
<h1>☄️ METEOR STORE</h1>
<select id="role">
<option value="buyer">Pembeli</option><option value="admin">Admin</option>
<option value="owner">Owner</option>
</select>
<input id="user" placeholder="Username / Email / ID">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<button onclick="register()">DAFTAR PEMBELI</button>
<p id="msg"></p>
</div>

<div id="app">
<div class="side">
<h2>☄️ Meteor</h2>
<div id="menu"></div>
<button onclick="logout()">🚪 Logout</button>
</div>
<div class="main">
<h2 id="title"></h2>
<div id="content"></div>
</div>
</div>

<script>
let db=JSON.parse(localStorage.ms||'{"buyers":[],"admins":[],"events":[],"trx":[],"maint":false}');
let me=null;

function save(){localStorage.ms=JSON.stringify(db)}
function rup(x){return'Rp '+Number(x).toLocaleString('id-ID')}
function register(){
 let n=prompt('Nama'),e=prompt('Email'),p=prompt('Password'),w=prompt('WhatsApp');
 if(!n||!e||!p)return;
 let id;do{id=Math.floor(1000+Math.random()*9000)}while(db.buyers.some(x=>x.id==id));
 db.buyers.push({id,name:n,email:e,pass:p,wa:w,balance:0});
 save();alert('Berhasil! ID Pembeli: '+id);
}
function login(){
 let r=role.value,u=user.value,p=pass.value;
 if(r=='owner'&&u=='michie'&&p=='mich'){me={role:'owner',name:'Owner'}}
 else if(r=='admin'&&u=='admin'&&p=='admin123'){me={role:'admin',name:'Admin'}}
 else{
  let b=db.buyers.find(x=>(x.email==u||x.id==u)&&x.pass==p);
  if(r!='buyer'||!b)return msg.innerText='Login gagal';
  me={role:'buyer',id:b.id,name:b.name}
 }
 loginPage()
}
function loginPage(){
 login.style.display='none';app.style.display='block';
 let m=me.role=='owner'
 ?['Dashboard','Pembeli','Admin','Transaksi','Saldo','Maintenance']
 :me.role=='admin'?['Dashboard','Tambah Akun','Riwayat']:['Marketplace','Transaksi','Profil','Top Up'];
 menu.innerHTML=m.map(x=>`<button onclick="page('${x}')">${x}</button>`).join('');
 page(m[0])
}
function logout(){me=null;app.style.display='none';login.style.display='block';user.value=pass.value=''}
function page(x){
 title.innerText=x;
 if(db.maint&&me.role!='owner'&&x!='Dashboard')
  return content.innerHTML='<div class=card>🔧 Sedang Maintenance</div>';
 if(x=='Marketplace')return market();
 if(x=='Tambah Akun')return add();
 if(x=='Transaksi')return transaksi();
 if(x=='Pembeli')return buyers();
 if(x=='Admin')return admins();
 if(x=='Saldo')return saldo();
 if(x=='Maintenance')return maintenance();
 if(x=='Profil')return profil();
 if(x=='Top Up')return topup();
 content.innerHTML='<div class=card>Selamat datang di Meteor Store ☄️</div>'
}
<script>
function market(){
 content.innerHTML='<div class=grid>'+db.events.map((e,i)=>`
 <div class=card>
 ${e.img?`<img src="${e.img}">`:''}
 <h3>${e.name}</h3><p>${e.desc}</p>
 <b>${rup(e.price)}</b><br>Stok: ${e.stock}<br>
 <small>Admin: ${e.admin}</small><br>
 <button onclick="buy(${i})">BELI</button>
 <button onclick="window.open('${e.link||'#'}')">TONTON</button>
 </div>`).join('')+'</div>'
}
function add(){
 if(me.role!='admin')return;
 content.innerHTML=`<div class=card>
 <input id="en" placeholder="Nama akun/event">
 <textarea id="ed" placeholder="Deskripsi"></textarea>
 <input id="ep" type="number" placeholder="Harga">
 <input id="es" type="number" placeholder="Stok">
 <input id="el" placeholder="Link event">
 <textarea id="data" placeholder="Data akun"></textarea>
 <button onclick="addEvent()">SIMPAN</button></div>
 <h3>Barang Saya</h3>`+
 db.events.filter(e=>e.admin==me.name).map((e,i)=>`<div class=card>${e.name} <button onclick="del(${i})">Hapus</button></div>`).join('')
}
function addEvent(){
 db.events.push({name:en.value,desc:ed.value,price:+ep.value,stock:+es.value,
 link:el.value,data:data.value,admin:me.name});save();page('Tambah Akun')
}
function del(i){db.events.splice(i,1);save();page('Tambah Akun')}
function buy(i){
 let e=db.events[i],b=db.buyers.find(x=>x.id==me.id);
 if(!b)return;
 if(e.stock<1)return alert('Stok habis');
 if(b.balance<e.price)return alert('Saldo tidak cukup');
 b.balance-=e.price;e.stock--;
 db.trx.push({buyer:b.id,item:e.name,price:e.price,date:new Date().toLocaleString()});
 save();alert('Berhasil membeli!\nData: '+e.data);market()
}
function transaksi(){
 let a=db.trx.filter(x=>me.role=='buyer'?x.buyer==me.id:1);
 content.innerHTML=a.map(x=>`<div class=card>${x.item}<br>${rup(x.price)}<br>${x.date}</div>`).join('')||'Belum ada transaksi'
}
function buyers(){
 content.innerHTML=db.buyers.map(b=>`<div class=card>
 ID: ${b.id}<br>${b.name}<br>${b.email}<br>Saldo: ${rup(b.balance)}
 <button onclick="isi(${b.id})">+ SALDO</button></div>`).join('')
}
function isi(id){
 let b=db.buyers.find(x=>x.id==id),n=+prompt('Tambah saldo');
 if(n>0){b.balance+=n;save();buyers()}
}
function admins(){
 content.innerHTML=`<div class=card>
 <input id="an" placeholder="Username">
 <input id="ap" placeholder="Password">
 <button onclick="db.admins.push({name:an.value,pass:ap.value});save();admins()">Tambah Admin</button>
 </div>`+db.admins.map(a=>`<div class=card>${a.name}</div>`).join('')
}
function saldo(){buyers()}
function maintenance(){
 content.innerHTML=`<div class=card>
 Status: ${db.maint?'AKTIF':'MATI'}<br>
 <button onclick="db.maint=!db.maint;save();maintenance()">
 ${db.maint?'MATIKAN':'AKTIFKAN'} MAINTENANCE
 </button></div>`
}
function profil(){
 let b=db.buyers.find(x=>x.id==me.id);
 content.innerHTML=`<div class=card>ID: ${b.id}<br>Nama: ${b.name}<br>Email: ${b.email}<br>Saldo: ${rup(b.balance)}</div>`
}
function topup(){
 content.innerHTML=`<div class=card>
 <h3>Top Up Saldo</h3>
 <p>Hubungi Owner melalui WhatsApp</p>
 <button onclick="location.href='https://wa.me/6289676780806?text=MIN%20MAU%20TOP%20UP.'">
 TOP UP VIA WHATSAPP
 </button></div>`
}
</script>
</body>
</html>
